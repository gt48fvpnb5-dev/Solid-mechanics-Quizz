<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solid Mechanics - Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['$$','$$']]},options:{skipHtmlTags:['script','noscript','style','textarea']}};</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
:root{--bg:#f5f4f0;--surface:#fff;--surface2:#efefea;--border:#ddddd8;--text:#1a1a18;--text2:#6b6b67;--text3:#a0a09c;--accent:#2d5be3;--accent-light:#e8edfc;--star:#e6a817;--star-bg:#fdf5e0;--correct:#1a7a4a;--correct-bg:#e6f5ed;--wrong:#c0392b;--wrong-bg:#fdecea;--radius:14px;--radius-sm:8px;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6;}
header{padding:20px 32px 0;}
.logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;}
.logo span{color:var(--accent);}
.screen{display:none;} .screen.active{display:block;}

/* HOME */
#home{max-width:680px;margin:0 auto;padding:48px 24px 80px;}
#home h1{font-size:28px;font-weight:500;margin-bottom:6px;letter-spacing:-.02em;}
.subtitle{color:var(--text2);font-size:14px;margin-bottom:36px;}
.section-label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:28px;}
.quiz-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none;position:relative;}
.quiz-card:hover{border-color:#bbb;}
.quiz-card.selected{border-color:var(--accent);background:var(--accent-light);}
.quiz-card .qnum{font-family:var(--mono);font-size:11px;color:var(--text3);margin-bottom:4px;}
.quiz-card .qtitle{font-size:12px;font-weight:500;color:var(--text);line-height:1.4;}
.quiz-card .qcount{font-size:11px;color:var(--text2);margin-top:4px;}
.quiz-card .check{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--accent);display:none;align-items:center;justify-content:center;}
.quiz-card.selected .check{display:flex;}
.check svg{width:10px;height:10px;fill:white;}
.action-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:50px;border:none;cursor:pointer;font-family:var(--font);font-size:14px;font-weight:500;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--text);color:#fff;} .btn-primary:hover{opacity:.85;}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);} .btn-secondary:hover{background:var(--surface2);}
.btn-star{background:var(--star-bg);color:var(--star);border:1px solid #f0d98a;} .btn-star:hover{background:#faeec0;}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none;}
.stars-info{background:var(--star-bg);border:1px solid #f0d98a;border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;color:#7a5a00;display:flex;align-items:center;gap:8px;}

/* STUDY */
#study{max-width:660px;margin:0 auto;padding:28px 24px 100px;overflow-y:auto;}
.study-header{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.nav-fixed{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);padding:12px 24px 16px;display:none;flex-direction:column;align-items:center;gap:6px;z-index:100;}
.nav-fixed.active{display:flex;}
.back-btn{background:none;border:1px solid var(--border);border-radius:50px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:var(--font);color:var(--text2);}
.back-btn:hover{background:var(--surface2);}
.study-title{font-size:14px;font-weight:500;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.star-count-badge{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--star);font-weight:500;flex-shrink:0;}
.progress-bar-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}
.progress-text{text-align:center;font-size:12px;color:var(--text3);font-family:var(--mono);margin-bottom:16px;}

/* CARD (flip) */
.card-wrap{margin-bottom:16px;}
.card-body{position:relative;width:100%;min-height:220px;cursor:pointer;}
.card-face{width:100%;min-height:220px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:0 2px 16px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 36px;}
.card-back-face{display:none;align-items:flex-start;}
.card-body.flipped #frontFace{display:none;}
.card-body.flipped #backFace{display:flex;}
.card-body.flipping-out{animation:flipOut .2s ease-in forwards;}
.card-body.flipping-in{animation:flipIn .2s ease-out forwards;}
@keyframes flipOut{from{transform:scaleX(1);}to{transform:scaleX(0);}}
@keyframes flipIn{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.face-label{position:absolute;top:14px;left:18px;font-size:10px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.star-btn{position:absolute;top:10px;right:14px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;opacity:.4;transition:opacity .15s,transform .15s;pointer-events:auto;}
.star-btn:hover{opacity:.85;transform:scale(1.15);}
.star-btn.starred{opacity:1;color:var(--star);}
.card-q{font-size:17px;font-weight:400;text-align:center;color:var(--text);line-height:1.55;}
.card-a{font-size:14px;color:var(--text);line-height:1.8;width:100%;}

/* MCQ */
.mcq-area{margin-bottom:16px;}
.mcq-opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin:7px 0;font-size:14px;color:var(--text);cursor:pointer;font-family:var(--font);transition:border-color .12s,background .12s;}
.mcq-opt:hover:not(:disabled){background:var(--surface2);border-color:#bbb;}
.mcq-opt.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);font-weight:500;}
.mcq-opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong);}
.mcq-opt:disabled{cursor:default;}

/* CHECKBOX */
.checkbox-area{margin-bottom:16px;}
.cb-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;margin:7px 0;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s;user-select:none;}
.cb-item:hover{background:var(--surface2);}
.cb-item.cb-correct{border-color:var(--correct);background:var(--correct-bg);}
.cb-item.cb-wrong{border-color:var(--wrong);background:var(--wrong-bg);}
.cb-item.cb-missed{border-color:#e6a817;background:#fdf5e0;}
.cb-box{width:18px;height:18px;border:1.5px solid var(--border);border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;}
.cb-item.checked .cb-box{background:var(--accent);border-color:var(--accent);}
.cb-check{font-size:11px;color:white;display:none;}
.cb-item.checked .cb-check{display:block;}
.cb-label{font-size:14px;color:var(--text);line-height:1.5;}
.cb-submit{display:block;width:100%;padding:10px;background:var(--text);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);font-weight:500;cursor:pointer;margin-top:8px;}
.cb-submit:hover{opacity:.85;}
.cb-submit:disabled{opacity:.4;cursor:default;}
.cb-result{font-size:13px;font-weight:500;text-align:center;margin-top:8px;padding:8px;border-radius:var(--radius-sm);}
.cb-result.ok{color:var(--correct);background:var(--correct-bg);}
.cb-result.ko{color:var(--wrong);background:var(--wrong-bg);}

.hint-text{text-align:center;font-size:12px;color:var(--text3);margin-bottom:4px;}
.shortcuts-hint{text-align:center;font-size:11px;color:var(--text3);font-family:var(--mono);}
.nav-row{display:flex;align-items:center;justify-content:center;gap:12px;}
.nav-arrow{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .12s;color:var(--text);}
.nav-arrow:hover{background:var(--surface2);}
.nav-arrow:disabled{opacity:.3;cursor:default;}

/* FINISH */
#finish{max-width:500px;margin:0 auto;padding:80px 24px;text-align:center;}
#finish h2{font-size:26px;font-weight:500;margin-bottom:10px;}
#finish p{color:var(--text2);margin-bottom:32px;}
.finish-btns{display:flex;flex-direction:column;gap:10px;align-items:center;}
@media(max-width:500px){#home,#study{padding-left:16px;padding-right:16px;}.card-face{padding:28px 20px;}.card-q{font-size:15px;}}
mjx-container{font-size:1em !important;}
</style>
</head>
<body>
<header><div class="logo">Solid Mechanics <span>BME &middot; Bern &middot; 2026</span><span style="margin-left:16px;color:var(--text3);font-size:11px;">v1.3</span></div></header>

<div id="home" class="screen active">
  <h1>Flashcards</h1>
  <p class="subtitle">Select the quizzes you want to study</p>
  <p class="section-label">Available quizzes</p>
  <div class="quiz-grid" id="quizGrid"></div>
  <div class="action-row">
    <button class="btn btn-secondary" onclick="selectAll()">Select all</button>
    <button class="btn btn-secondary" onclick="deselectAll()">Deselect all</button>
  </div>
  <div class="action-row">
    <button class="btn btn-primary" id="startBtn" onclick="startStudy(false)">&#9654; Study selected</button>
    <button class="btn btn-star" id="starOnlyBtn" onclick="startStudy(true)">&#9733; Starred only</button>
  </div>
  <div id="starsInfo" class="stars-info" style="display:none"><span>&#9733;</span><span id="starsInfoText"></span></div>
</div>

<div id="study" class="screen">
  <div class="study-header">
    <button class="back-btn" onclick="goHome()">&#8592; Back</button>
    <span class="study-title" id="studyTitle"></span>
    <span class="star-count-badge" id="starCountBadge" style="display:none">&#9733; <span id="starCountNum">0</span></span>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-text" id="progressLabel"></div>
  <div class="card-wrap">
    <div class="card-body" id="cardBody" onclick="handleCardClick()">
      <div class="card-face" id="frontFace">
        <span class="face-label">Question</span>
        <button class="star-btn" id="starBtn2" onclick="event.stopPropagation();toggleStar()" title="Star (S)" style="pointer-events:auto">&#9733;</button>
        <div class="card-q" id="cardQ"></div>
      </div>
      <div class="card-face card-back-face" id="backFace">
        <span class="face-label">Answer</span>
        <div class="card-a" id="cardA"></div>
      </div>
    </div>
  </div>
  <div class="mcq-area" id="mcqArea" style="display:none"></div>
  <div class="checkbox-area" id="checkboxArea" style="display:none"></div>
  <div class="hint-text" id="hintText"></div>
</div>

<div class="nav-fixed" id="navFixed">
  <div class="nav-row">
    <button class="nav-arrow" id="prevArrow" onclick="navigate(-1)">&#8592;</button>
    <button class="nav-arrow" id="nextArrow" onclick="navigate(1)">&#8594;</button>
  </div>
  <div class="shortcuts-hint">&#8592;&#8594; navigate &nbsp;&bull;&nbsp; space: flip &nbsp;&bull;&nbsp; S: star</div>
</div>

<div id="finish" class="screen">
  <h2 id="finishTitle">Session complete!</h2>
  <p id="finishSub"></p>
  <div class="finish-btns">
    <button class="btn btn-primary" onclick="restartSame()">&#8635; Restart same set</button>
    <button class="btn btn-star" id="reviewStarsBtn" onclick="startStudy(true)" style="display:none">&#9733; Review starred cards</button>
    <button class="btn btn-secondary" onclick="goHome()">&#8592; Back to menu</button>
  </div>
</div>

<script>
// Card types:
// "open"     = flip card (question front, answer back)
// "mcq"      = single-choice A/B/C buttons
// "checkbox" = multiple checkboxes, submit to reveal which are correct
//
// Prof notation: scalar plain, vector \underline{v}, tensor2 \underline{\underline{T}},
//                tensor3 \underline{\underline{\epsilon}}, tensor4 \mathbb{K}

var QUIZZES = [
{id:0,title:"Introductory lecture",cards:[
  {q:"Which musculoskeletal tissue undergoes the lowest strains?",a:"<b>Bone</b>: [&minus;0.15%, +0.1%]<br><br>&bull; Cartilage: [&minus;40%, +10%]<br>&bull; Muscle: [&minus;50%, +50%]",type:"open"},
  {q:"What is the problem of linear elasticity in 1D?",a:"Find \\(u(x,t)\\) such that: $$\\rho\\ddot{u} - \\kappa - \\frac{d\\sigma}{dx} = 0$$with \\(\\sigma = E\\varepsilon\\) and \\(\\varepsilon = \\dfrac{du}{dx}\\)",type:"open"},
  {q:"Provide 4 key words from the definition of mechanics?",a:"<b>motion</b> &middot; <b>forces</b> &middot; <b>energy</b> &middot; <b>laws</b>",type:"open"},
  {q:"What is the opposite of continuous?",a:"<b>Discrete</b>",type:"open"},
  {q:"Cite 3 variables of mechanics?",a:"Any 3 of: time &middot; positions/displacements &middot; forces/moments &middot; energy/power &middot; strains &middot; stresses &middot; internal variables",type:"open"},
  {q:"How many non collinear points do you need to define a reference frame in 3D?",a:"<b>4 points</b> &mdash; rule \\(N \\geq D+1\\), so \\(D=3 \\Rightarrow N \\geq 4\\)",type:"mcq",options:["2","3","4"],correct:2},
  {q:"What defines an orthogonal matrix?",a:"\\(Q_{ik}Q_{jk}=\\delta_{ij}\\), i.e. \\(\\underline{\\underline{Q}}\\,\\underline{\\underline{Q}}^T=\\underline{\\underline{I}}\\)",type:"mcq",options:["\\(Q_{ij}=Q_{ji}\\)","\\(\\exists w_k,\\ Q_{ij}=\\varepsilon_{ijk}w_k\\)","\\(Q_{ik}Q_{jk}=\\delta_{ij}\\)"],correct:2},
  {q:"What is the order of a tensor?",a:"<b>The number of indices to order its components</b><br>scalar\\(\\to\\)0 &middot; \\(\\underline{v}\\)\\(\\to\\)1 &middot; \\(\\underline{\\underline{T}}\\)\\(\\to\\)2",type:"mcq",options:["the physical units of the components","the dimension of the vector space","the number of indices to order its components"],correct:2},
  {q:"What are the order of the argument and the order of the function?<br>$$\\underline{y}: t \\to \\underline{y}(t)$$",a:"Argument \\(t\\): scalar &rarr; order <b>0</b><br>Function \\(\\underline{y}(t)\\): vector &rarr; order <b>1</b><br>(mapping \\(\\mathbb{R}\\to\\mathbb{R}^3\\))",type:"open"},
  {q:"What are the three types of tensor notations?",a:"1. <b>Intrinsic</b>: \\(\\alpha,\\ \\underline{v},\\ \\underline{\\underline{T}},\\ \\underline{\\underline{\\epsilon}},\\ \\mathbb{K}\\)<br>2. <b>Index</b>: \\(v_i,\\ T_{ij},\\ \\epsilon_{ijk},\\ K_{ijkl}\\)<br>3. <b>Explicit</b>: full matrix/column display",type:"open"}
]},
{id:1,title:"Tensor Algebra",cards:[
  {q:"Provide the index notation<br>\\(\\underline{\\underline{\\epsilon}}\\,\\underline{\\underline{A}}\\) &nbsp;&nbsp; \\(\\underline{\\underline{A}}:\\underline{\\underline{B}}\\) &nbsp;&nbsp; \\(\\underline{\\underline{A}}\\underline{\\underline{X}}\\)",a:"\\(\\underline{\\underline{\\epsilon}}\\,\\underline{\\underline{A}}\\) &rarr; \\(\\varepsilon_{ijk}A_{jl}\\) (free: \\(i,k,l\\))<br>\\(\\underline{\\underline{A}}:\\underline{\\underline{B}}\\) &rarr; \\(A_{ij}B_{ij}\\) (scalar)<br>\\(\\underline{\\underline{A}}\\underline{\\underline{X}}\\) &rarr; \\(A_{ik}X_{kj}\\)",type:"open"},
  {q:"Provide the intrinsic notation<br>\\(\\varepsilon_{ijk}a_kb_j\\) &nbsp;&nbsp; \\(A_{jl}B_{ik}\\) &nbsp;&nbsp; \\(\\sqrt{a_i^2}\\)",a:"\\(\\varepsilon_{ijk}a_kb_j = (\\underline{b}\\times\\underline{a})_i\\) &rarr; \\(\\underline{b}\\times\\underline{a}\\)<br>\\(A_{jl}B_{ik}\\): component of \\((\\underline{\\underline{A}}^T\\otimes\\underline{\\underline{B}})\\)<br>\\(\\sqrt{a_i^2}=\\|\\underline{a}\\|\\)",type:"open"},
  {q:"Provide the explicit notation<br>\\(a_ib_i\\) &nbsp;&nbsp; \\(A_{ij}x_i\\) &nbsp;&nbsp; \\(\\underline{a}\\otimes\\underline{b}\\)",a:"\\(a_ib_i = \\underline{a}\\cdot\\underline{b}\\) (scalar product)<br>\\(A_{ij}x_i = \\underline{x}^T\\underline{\\underline{A}}\\) (row times matrix)<br>\\(\\underline{a}\\otimes\\underline{b} = \\begin{pmatrix}a_1b_1&a_1b_2&a_1b_3\\\\a_2b_1&\\cdots&\\cdots\\\\a_3b_1&\\cdots&a_3b_3\\end{pmatrix}\\)",type:"open"},
  {q:"Indicate if the i index is free or mute<br>&#9675; \\(A_{ij}+B_{ij}=C_{ij}\\)<br>&#9675; \\(w_k=\\varepsilon_{kji}a_jb_i\\)<br>&#9675; \\(A_{ij}B_{ij}=0\\)",a:"\\(A_{ij}+B_{ij}=C_{ij}\\): \\(i\\) is <b>free</b> (appears once each side)<br>\\(w_k=\\varepsilon_{kji}a_jb_i\\): \\(i\\) is <b>mute</b> (summed with \\(j\\))<br>\\(A_{ij}B_{ij}=0\\): \\(i\\) is <b>mute</b> (repeated, summed)",type:"checkbox",items:["\\(A_{ij}+B_{ij}=C_{ij}\\): i is <b>free</b>","\\(w_k=\\varepsilon_{kji}a_jb_i\\): i is <b>mute</b>","\\(A_{ij}B_{ij}=0\\): i is <b>mute</b>"],correct:[0,1,2]},
  {q:"Check if the operators on \\(\\underline{\\underline{X}}\\) are linear<br>&#9675; \\(\\underline{\\underline{A}}\\underline{\\underline{X}}\\)<br>&#9675; \\(\\det\\underline{\\underline{X}}\\)<br>&#9675; \\(\\underline{\\underline{A}}:\\underline{\\underline{X}}\\)",a:"\\(\\underline{\\underline{A}}\\underline{\\underline{X}}\\): <b>linear</b> &#10003;<br>\\(\\det\\underline{\\underline{X}}\\): <b>NOT linear</b> (degree 3) &#10007;<br>\\(\\underline{\\underline{A}}:\\underline{\\underline{X}}\\): <b>linear</b> &#10003;",type:"checkbox",items:["\\(\\underline{\\underline{A}}\\underline{\\underline{X}}\\) is linear","\\(\\det\\underline{\\underline{X}}\\) is linear","\\(\\underline{\\underline{A}}:\\underline{\\underline{X}}\\) is linear"],correct:[0,2]},
  {q:"Check the true assertions<br>&#9675; the Levi-Civita tensor is of order 3<br>&#9675; \\(\\varepsilon_{132}=0\\)<br>&#9675; \\((\\underline{a}\\times\\underline{b})\\cdot\\underline{c}=\\underline{c}\\cdot\\underline{\\underline{\\epsilon}}(\\underline{a}\\otimes\\underline{b})\\)",a:"&bull; Levi-Civita order 3: <b>TRUE</b> &#10003;<br>&bull; \\(\\varepsilon_{132}=-1\\neq 0\\): <b>FALSE</b> &#10007;<br>&bull; \\((\\underline{a}\\times\\underline{b})\\cdot\\underline{c}=\\underline{c}\\cdot\\underline{\\underline{\\epsilon}}(\\underline{a}\\otimes\\underline{b})\\): <b>TRUE</b> &#10003;",type:"checkbox",items:["the Levi-Civita tensor is of order 3","\\(\\varepsilon_{132}=0\\)","\\((\\underline{a}\\times\\underline{b})\\cdot\\underline{c}=\\underline{c}\\cdot\\underline{\\underline{\\epsilon}}(\\underline{a}\\otimes\\underline{b})\\)"],correct:[0,2]},
  {q:"Check if the indices are compatible<br>&#9675; \\(a_i+b_j=c_k\\)<br>&#9675; \\(a_ib_j=C_{ij}\\)<br>&#9675; \\(A_{ijkl}B_{mnkl}=C_{ijmn}\\)",a:"&bull; \\(a_i+b_j=c_k\\): <b>incompatible</b> (different free indices) &#10007;<br>&bull; \\(a_ib_j=C_{ij}\\): <b>compatible</b> &#10003;<br>&bull; \\(A_{ijkl}B_{mnkl}=C_{ijmn}\\): <b>compatible</b> (\\(k,l\\) mute) &#10003;",type:"checkbox",items:["\\(a_i+b_j=c_k\\) is compatible","\\(a_ib_j=C_{ij}\\) is compatible","\\(A_{ijkl}B_{mnkl}=C_{ijmn}\\) is compatible"],correct:[1,2]},
  {q:"What is the degree of mathematical homogeneity of the following invariants?<br>\\(\\text{tr}(\\lambda\\underline{\\underline{F}})=\\) &nbsp; \\(\\text{sec}(\\lambda\\underline{\\underline{F}})=\\) &nbsp; \\(\\det(\\lambda\\underline{\\underline{F}})=\\)",a:"\\(\\text{tr}(\\lambda\\underline{\\underline{F}})=\\lambda\\,\\text{tr}(\\underline{\\underline{F}})\\) &rarr; degree <b>1</b><br>\\(\\text{sec}(\\lambda\\underline{\\underline{F}})=\\lambda^2\\,\\text{sec}(\\underline{\\underline{F}})\\) &rarr; degree <b>2</b><br>\\(\\det(\\lambda\\underline{\\underline{F}})=\\lambda^3\\det(\\underline{\\underline{F}})\\) &rarr; degree <b>3</b>",type:"open"},
  {q:"Of which spaces and operators are the following identity elements?<br>\\(1\\) &nbsp;&nbsp; \\(\\underline{\\underline{I}}\\) &nbsp;&nbsp; \\(\\underline{\\underline{I}}\\otimes\\underline{\\underline{I}}\\) &nbsp;&nbsp; \\(\\underline{\\underline{I}}\\,\\overline{\\otimes}\\,\\underline{\\underline{I}}\\)",a:"\\(1\\): identity of \\(\\mathbb{R}\\) (scalar mult.)<br>\\(\\underline{\\underline{I}}\\): identity for 2nd-order tensor composition \\(\\delta_{ik}X_{kj}=X_{ij}\\)<br>\\(\\underline{\\underline{I}}\\otimes\\underline{\\underline{I}}\\): 4th-order identity \\((\\delta_{ik}\\delta_{jl})\\)<br>\\(\\underline{\\underline{I}}\\,\\overline{\\otimes}\\,\\underline{\\underline{I}}\\): symmetric 4th-order transposer \\((\\delta_{il}\\delta_{jk})\\)",type:"open"},

  {q:"What conditions are necessary for the differential equation of \\(\\underline{u}(\\underline{x},t)\\) to be linear?<br>&#9675; volume forces must be linear in \\(\\underline{u}\\)<br>&#9675; \\(\\underline{\\underline{P}}\\) must be linear with respect to \\(\\underline{\\underline{H}}\\)<br>&#9675; inertial forces must vanish",a:"&bull; volume forces linear in \\(\\underline{u}\\): <b>TRUE</b> &#10003;<br>&bull; \\(\\underline{\\underline{P}}\\) linear w.r.t. \\(\\underline{\\underline{H}}\\): <b>TRUE</b> &#10003;<br>&bull; inertial forces must vanish: <b>FALSE</b> &#10007; (they can be linear in \\(\\underline{u}\\))",type:"checkbox",items:["volume forces must be linear in \\(\\underline{u}\\)","\\(\\underline{\\underline{P}}\\) must be linear with respect to \\(\\underline{\\underline{H}}\\)","inertial forces must vanish"],correct:[0,1]},
  {q:"What condition must a virtual velocity fulfill?",a:"<b>A. \\(\\delta\\dot{\\underline{u}}(\\underline{x},t)=\\underline{0}\\ \\forall\\underline{x}\\in\\Gamma_u\\ \\forall t\\)</b>",type:"mcq",options:["\\(\\delta\\dot{\\underline{u}}(\\underline{x},t)=\\underline{0}\\ \\forall\\underline{x}\\in\\Gamma_u\\ \\forall t\\)","\\(\\delta\\dot{\\underline{u}}(\\underline{x},t)=\\underline{0}\\ \\forall\\underline{x}\\in\\Omega_u\\ \\forall t\\)","\\(\\delta\\dot{\\underline{u}}(\\underline{x},0)=\\underline{0}\\ \\forall\\underline{x}\\in\\Gamma_u\\)"],correct:0},
  {q:"What is the algebric nature of the principle of virtual power?",a:"<b>A. scalar</b> &mdash; integral equation yields a scalar",type:"mcq",options:["scalar","vectorial","tensorial"],correct:0},
  {q:"Do BVPs have a unique solution for \\(\\underline{u}(\\underline{x},t)\\)?",a:"<b>B. under some conditions</b> &mdash; requires polyconvexity of free energy",type:"mcq",options:["never","under some conditions","always"],correct:1}
]}
];

var starred=JSON.parse(localStorage.getItem("sm_starred")||"{}");
var selected=new Set([0]);
var deck=[],current=0,flipped=false,mcqDone=false,cbDone=false,starOnlyMode=false;
var shuffledCorrect=0;

function saveStarred(){localStorage.setItem("sm_starred",JSON.stringify(starred));}
function cardKey(qid,cid){return"q"+qid+"_c"+cid;}
function isStarred(qid,cid){return!!starred[cardKey(qid,cid)];}
function toggleStarCard(qid,cid){var k=cardKey(qid,cid);if(starred[k]){delete starred[k];}else{starred[k]=true;}saveStarred();}
function totalStarCount(){return Object.keys(starred).length;}
function typeset(el){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([el]).catch(function(){});}}

function buildHome(){
  var grid=document.getElementById("quizGrid");grid.innerHTML="";
  QUIZZES.forEach(function(q,i){
    var div=document.createElement("div");
    div.className="quiz-card"+(selected.has(i)?" selected":"");
    div.innerHTML="<div class=\"qnum\">Quiz "+String(q.id).padStart(2,"0")+"</div><div class=\"qtitle\">"+q.title+"</div><div class=\"qcount\">"+q.cards.length+" cards</div><div class=\"check\"><svg viewBox=\"0 0 12 9\"><polyline points=\"1,4.5 4.5,8 11,1\" stroke=\"white\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg></div>";
    div.onclick=function(){if(selected.has(i)){selected.delete(i);}else{selected.add(i);}buildHome();};
    grid.appendChild(div);
  });
  var sc=totalStarCount();
  document.getElementById("starOnlyBtn").disabled=sc===0;
  var si=document.getElementById("starsInfo");
  if(sc>0){si.style.display="flex";document.getElementById("starsInfoText").textContent="You have "+sc+" starred card"+(sc>1?"s":"")+" across all quizzes.";}
  else{si.style.display="none";}
  document.getElementById("startBtn").disabled=selected.size===0;
}
function selectAll(){QUIZZES.forEach(function(_,i){selected.add(i);});buildHome();}
function deselectAll(){selected.clear();buildHome();}
function goHome(){show("home");buildHome();}

function startStudy(starsOnly){
  starOnlyMode=starsOnly;deck=[];
  if(starsOnly){QUIZZES.forEach(function(q,qi){q.cards.forEach(function(c,ci){if(isStarred(qi,ci)){deck.push(Object.assign({},c,{qid:qi,cid:ci}));}});});}
  else{selected.forEach(function(qi){QUIZZES[qi].cards.forEach(function(c,ci){deck.push(Object.assign({},c,{qid:qi,cid:ci}));});});}
  if(deck.length===0){alert("No cards to study!");return;}
  current=0;show("study");
  var te=document.getElementById("studyTitle");
  if(starsOnly){te.textContent="Starred cards";}
  else if(selected.size===QUIZZES.length){te.textContent="All quizzes";}
  else{var ns=[];selected.forEach(function(i){ns.push("Quiz "+String(QUIZZES[i].id).padStart(2,"0"));});te.textContent=ns.join(" + ");}
  showCard();
}

function showCard(){
  flipped=false;mcqDone=false;cbDone=false;flipping=false;
  document.getElementById("nextArrow").textContent="→";
  document.getElementById("nextArrow").innerHTML="&#8594;";
  var c=deck[current];
  var body=document.getElementById("cardBody");
  body.classList.remove("flipped");body.style.pointerEvents="";
  var qEl=document.getElementById("cardQ");qEl.innerHTML=c.q;
  var aEl=document.getElementById("cardA");aEl.innerHTML=c.a;
  if(window.MathJax&&MathJax.typesetPromise){
    MathJax.typesetPromise([qEl,aEl]).catch(function(){});
  }
  var sb=document.getElementById("starBtn2");
  if(isStarred(c.qid,c.cid)){sb.classList.add("starred");}else{sb.classList.remove("starred");}
  var mcqArea=document.getElementById("mcqArea");
  var cbArea=document.getElementById("checkboxArea");
  var hint=document.getElementById("hintText");
  mcqArea.style.display="none";mcqArea.innerHTML="";
  cbArea.style.display="none";cbArea.innerHTML="";

  if(c.type==="mcq"){
    hint.textContent="Choose the correct answer (or tap card to see answer)";
    mcqArea.style.display="block";
    var indices=c.options.map(function(_,i){return i;});
    for(var si=indices.length-1;si>0;si--){var sj=Math.floor(Math.random()*(si+1));var tmp=indices[si];indices[si]=indices[sj];indices[sj]=tmp;}
    shuffledCorrect=indices.indexOf(c.correct);
    mcqArea.innerHTML=indices.map(function(origIdx,dispIdx){return"<button class=\"mcq-opt\" id=\"mopt"+dispIdx+"\" onclick=\"answerMCQ("+dispIdx+","+shuffledCorrect+")\">"+c.options[origIdx]+"</button>";}).join("");
    mcqArea.querySelectorAll(".mcq-opt").forEach(function(b){typeset(b);});
  } else if(c.type==="checkbox"){
    body.style.pointerEvents="none";hint.textContent="Check all true assertions then click Submit";
    cbArea.style.display="block";
    var html="";
    c.items.forEach(function(item,idx){
      html+="<div class=\"cb-item\" id=\"cb"+idx+"\" onclick=\"toggleCb("+idx+")\"><div class=\"cb-box\"><span class=\"cb-check\">&#10003;</span></div><div class=\"cb-label\">"+item+"</div></div>";
    });
    html+="<button class=\"cb-submit\" id=\"cbSubmit\" onclick=\"submitCb()\">Submit</button>";
    cbArea.innerHTML=html;
    cbArea.querySelectorAll(".cb-label").forEach(function(b){typeset(b);});
  } else {
    hint.textContent="Click the card to reveal the answer";
  }
  updateProgress();updateStarCount();
  document.getElementById("prevArrow").disabled=current===0;
  document.getElementById("nextArrow").disabled=current===deck.length-1;
}

var flipping=false;
function handleCardClick(){
  if(flipping)return;
  if(deck[current]&&deck[current].type==="checkbox")return;
  flipping=true;
  var body=document.getElementById("cardBody");
  var hint=document.getElementById("hintText");
  body.classList.add("flipping-out");
  setTimeout(function(){
    body.classList.remove("flipping-out");
    if(flipped){
      flipped=false;
      body.classList.remove("flipped");
      hint.textContent="Click the card to reveal the answer";
    } else {
      flipped=true;
      body.classList.add("flipped");
      hint.textContent="Click again to see the question";
    }
    body.classList.add("flipping-in");
    setTimeout(function(){
      body.classList.remove("flipping-in");
      flipping=false;
    },200);
  },200);
}

function answerMCQ(idx,sc){
  if(mcqDone)return;mcqDone=true;
  var c=deck[current];
  var btns=document.querySelectorAll(".mcq-opt");
  btns.forEach(function(b){b.disabled=true;});
  btns[sc].classList.add("correct");
  if(idx!==sc){btns[idx].classList.add("wrong");}
  document.getElementById("cardBody").classList.add("flipped");
  document.getElementById("cardBody").style.pointerEvents="none";
  document.getElementById("hintText").textContent=idx===sc?"Correct!":"Wrong - see the answer above";
  flipped=true;
  if(current===deck.length-1){document.getElementById("nextArrow").textContent="Done ✓";}
}

function toggleCb(idx){
  if(cbDone)return;
  var item=document.getElementById("cb"+idx);
  item.classList.toggle("checked");
}

function submitCb(){
  if(cbDone)return;cbDone=true;
  var c=deck[current];
  var checked=[];
  c.items.forEach(function(_,idx){if(document.getElementById("cb"+idx).classList.contains("checked")){checked.push(idx);}});
  var correct=c.correct||[];
  var allCorrect=true;
  c.items.forEach(function(_,idx){
    var item=document.getElementById("cb"+idx);
    var shouldBeChecked=correct.indexOf(idx)>=0;
    var isChecked=checked.indexOf(idx)>=0;
    if(shouldBeChecked&&isChecked){item.classList.add("cb-correct");}
    else if(!shouldBeChecked&&isChecked){item.classList.add("cb-wrong");allCorrect=false;}
    else if(shouldBeChecked&&!isChecked){item.classList.add("cb-missed");allCorrect=false;}
  });
  document.getElementById("cbSubmit").disabled=true;
  var res=document.createElement("div");
  res.className="cb-result "+(allCorrect?"ok":"ko");
  res.textContent=allCorrect?"All correct!":"Some wrong - green=correct, red=wrong, orange=missed";
  document.getElementById("checkboxArea").appendChild(res);
  document.getElementById("cardBody").classList.add("flipped");
  document.getElementById("hintText").textContent=allCorrect?"Perfect!":"See corrections above";
  flipped=true;
  if(current===deck.length-1){document.getElementById("nextArrow").textContent="Done ✓";}
}

function navigate(dir){
  var next=current+dir;
  if(next<0)return;
  if(next>=deck.length){showFinish();return;}
  current=next;showCard();
}
function toggleStar(){
  var c=deck[current];toggleStarCard(c.qid,c.cid);
  var sb=document.getElementById("starBtn2");
  if(isStarred(c.qid,c.cid)){sb.classList.add("starred");}else{sb.classList.remove("starred");}
  updateStarCount();
}
function updateProgress(){
  var pct=((current+1)/deck.length)*100;
  document.getElementById("progressFill").style.width=pct+"%";
  document.getElementById("progressLabel").textContent=(current+1)+" / "+deck.length;
}
function updateStarCount(){
  var sc=totalStarCount();
  document.getElementById("starCountNum").textContent=sc;
  document.getElementById("starCountBadge").style.display=sc>0?"flex":"none";
}
function showFinish(){
  show("finish");var sc=totalStarCount();
  document.getElementById("finishTitle").textContent=starOnlyMode?"Starred review complete!":"Session complete!";
  document.getElementById("finishSub").textContent=sc>0?"You have "+sc+" starred card"+(sc>1?"s":"")+" to review.":"No starred cards - you are good!";
  document.getElementById("reviewStarsBtn").style.display=sc>0?"inline-flex":"none";
}
function restartSame(){current=0;show("study");showCard();}
function show(id){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("active");});
  document.getElementById(id).classList.add("active");
  document.getElementById("navFixed").classList.toggle("active", id==="study");
}

buildHome();

// iOS fix: prevent touchend from also firing click on the card
document.getElementById("cardBody").addEventListener("touchend", function(e){
  if(deck[current]&&deck[current].type==="checkbox")return;
  e.preventDefault();
  handleCardClick();
}, {passive:false});

document.addEventListener("keydown",function(e){
  var screen=document.querySelector(".screen.active");
  if(!screen||screen.id!=="study")return;
  if(e.target.tagName==="BUTTON"||e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();navigate(1);}
  else if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();navigate(-1);}
  else if(e.key===" "){e.preventDefault();handleCardClick();}
  else if(e.key==="s"||e.key==="S"){e.preventDefault();toggleStar();}
});
</script>
</body>
</html>
